[package]
name = "monosend"
version = "0.0.1"
edition = "2024"
description = "A focused LocalSend CLI for sending and receiving files."
license = "MIT"
repository = "https://github.com/dantevazquez/monosend"
readme = "README.md"
keywords = ["tui", "localsend", "file-transfer", "p2p", "ratatui"]
categories = ["command-line-utilities", "filesystem"]

[dependencies]
color-eyre = "0.6.5"
crossterm = { version = "0.29.0", features = ["event-stream"] }
ratatui = "0.29.0"

tokio = { version = "1.43", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
axum = { version = "0.8", features = ["macros"] }
hyper-util = { version = "0.1", features = ["server", "client", "tokio", "http1", "http2", "service"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls-native-roots"] }
rcgen = "0.13"
rustls = { version = "0.23", features = ["ring"] }
tokio-rustls = "0.26"
uuid = { version = "1.11", features = ["v4"] }
futures-util = "0.3"
hostname = "0.4"
sha2 = "0.10"
hex = "0.4"
socket2 = "0.5"
libc = "0.2"
